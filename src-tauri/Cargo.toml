[package]
name = "tauri-source-extractor"
version = "0.4.0"
description = "Tauri 关键源码提取器"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tauri_source_extractor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# 只开 deflate：源码打包够用，避免拖进 aes/lzma/zstd 等一堆用不上的重依赖
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
